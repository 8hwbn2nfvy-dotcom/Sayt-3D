<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lego F1 AMR24 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; color: #d7dbe0; font: 14px/1.3 system-ui, sans-serif; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 12px; align-items: center; }
  #ui input[type=range] { flex: 1; min-width: 0; accent-color: #2fa35a; }
  #ui button { background: #1b1e23; color: #d7dbe0; border: 1px solid #343941; border-radius: 6px; padding: 8px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
  #ui button:hover { background: #252a31; }
  #time { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
  #nogl { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; font-size: 18px; }
  body.video #ui { display: none; }
</style>
</head>
<body>
<div id="view"></div>
<div id="ui">
  <button id="reset" type="button">Сбросить вид</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Время ролика">
  <span id="time">0.0 с</span>
</div>
<div id="nogl">Ваш браузер или видеокарта не поддерживают WebGL, поэтому 3D-сцену показать нельзя.<br>Попробуйте свежий Chrome, Firefox или Safari либо включите аппаратное ускорение.</div>
<script src="three.js"></script>
<script>
'use strict';
// ------------------------------------------------------------
// Lego F1 AMR24 (набор 77245): 3D-ролик 15 с.
// Одна функция poseAt(t) задаёт всё, что видно на секунде t.
// Страница вызывает её по часам, рендер видео — по номеру кадра.
// Единица длины = 1 шип Лего (8 мм). Машинка смотрит носом в +X.
// ------------------------------------------------------------
const BOX_TEXTURE = '__BOX_TEXTURE__';
const DURATION = 15;
const VIDEO = /[?&]video=1/.test(location.search);

function webglOK() {
  try { const c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); }
  catch (e) { return false; } // нет WebGL — покажем надпись
}
if (!window.THREE || !webglOK()) {
  document.getElementById('nogl').style.display = 'flex';
  document.getElementById('ui').style.display = 'none';
  throw new Error('WebGL недоступен');
}

// ---------- мелкие помощники ----------
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(77245);

// ---------- рендерер, сцена ----------
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: VIDEO });
renderer.setPixelRatio(VIDEO ? 1 : Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
view.appendChild(renderer.domElement);

const BG = 0x07080a;
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 90, 230);

const camera = new THREE.PerspectiveCamera(38, 16 / 9, 0.5, 600);

// Один источник света: мягкий направленный «софтбокс» сверху-слева-спереди.
const KEY_OFFSET = new THREE.Vector3(10, 48, 20);
const key = new THREE.DirectionalLight(0xfff4e8, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(4096, 4096);
key.shadow.camera.left = -42; key.shadow.camera.right = 42;
key.shadow.camera.top = 42; key.shadow.camera.bottom = -42;
key.shadow.camera.near = 1; key.shadow.camera.far = 160;
key.shadow.radius = 4;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
scene.add(key, key.target);
// Слабая заливка, чтобы тени не были чёрными провалами (это не второй источник, а «отражённый свет»).
scene.add(new THREE.AmbientLight(0x9aa6b8, 0.85));

// Отражения для пластика: тёмная комната с одной светлой панелью в той же стороне, что и свет.
{
  const pm = new THREE.PMREMGenerator(renderer);
  const room = new THREE.Scene();
  room.background = new THREE.Color(0x050608);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(14, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  panel.position.copy(KEY_OFFSET).normalize().multiplyScalar(12);
  panel.lookAt(0, 0, 0);
  room.add(panel);
  scene.environment = pm.fromScene(room, 0.02).texture;
  scene.environmentIntensity = 0.9;
  pm.dispose();
}

// ---------- кубики Лего ----------
// Цвета взяты с фото IMG_3999, чтобы кубики и наклейки с фото были одного тона.
const C = { green: 0x237a40, dgreen: 0x1c5f31, helmet: 0x3f9a58, black: 0x121412, gray: 0x4c5056, yellow: 0xf1c21b, tyre: 0x1a1b18 };
const matCache = {};
function mat(color, extra) {
  const k = color + (extra ? JSON.stringify(extra) : '');
  if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.34, metalness: 0 }, extra || {}));
  return matCache[k];
}

// Наклейки: картинки, вырезанные из фото (tools/make_decals.py), встроены в страницу.
const DECALS = __DECALS__;
const loading = new THREE.LoadingManager(() => { window.__texReady = true; if (window.requestRender) window.requestRender(); });
const texLoader = new THREE.TextureLoader(loading);
const decalMats = {};
function decalMat(name) {
  if (!decalMats[name]) {
    const tex = texLoader.load(DECALS[name]);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    // наклейка с фото уже несёт свет комнаты, поэтому слегка приглушаем её, чтобы совпала с соседними кубиками
    decalMats[name] = new THREE.MeshStandardMaterial({ map: tex, color: 0xffffff, roughness: 0.4, metalness: 0 });
  }
  return decalMats[name];
}

// Склейка нескольких геометрий в одну (корпус кубика + шипы = одна сетка).
function merge(geoms) {
  const parts = geoms.map((g) => g.index ? g.toNonIndexed() : g);
  let n = 0; parts.forEach((g) => { n += g.attributes.position.count; });
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
  let o = 0;
  parts.forEach((g) => { pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3); o += g.attributes.position.count; });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  return out;
}
const GAP = 0.04; // щель между кубиками, чтобы были видны швы
const studGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.18, 16);

// Коробочка (x0..x1, y0..y1, z0..z1) с шипами сверху.
// dropFront/dropBack — верх опускается спереди/сзади (клин); sinkFront — весь перед опускается (наклонный брус).
function blockGeo(b) {
  const w = b.x1 - b.x0 - GAP, h = b.y1 - b.y0 - GAP, d = b.z1 - b.z0 - GAP;
  const g = new THREE.BoxGeometry(w, h, d);
  const shaped = b.dropFront || b.dropBack || b.sinkFront;
  if (shaped) {
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      let y = p.getY(i);
      if (y > 0 && b.dropFront && p.getX(i) > 0) y -= b.dropFront;
      if (y > 0 && b.dropBack && p.getX(i) < 0) y -= b.dropBack;
      if (b.sinkFront && p.getX(i) > 0) y -= b.sinkFront;
      p.setY(i, y);
    }
    g.computeVertexNormals();
  }
  if (b.decal) return g; // у кубика с наклейкой гладкий верх (как у плитки) и свои UV
  const list = [g];
  if (b.studs && !shaped) {
    for (let x = Math.ceil(b.x0); x < b.x1 - 0.5; x++) {
      for (let z = Math.ceil(b.z0); z < b.z1 - 0.5; z++) {
        const s = studGeo.clone();
        s.translate(x + 0.5 - (b.x0 + b.x1) / 2, h / 2 + 0.09, z + 0.5 - (b.z0 + b.z1) / 2);
        list.push(s);
      }
    }
  }
  return list.length > 1 ? merge(list) : g;
}

// ---------- части машинки ----------
// dir — куда улетает часть при разборе (в координатах машинки), dist — как далеко, spread — насколько расходятся кубики внутри части.
const PARTS = {
  wheelFL: { dir: [0.35, 0.35, 1], dist: 8, spread: 0, wheel: true },
  wheelFR: { dir: [0.35, 0.35, -1], dist: 8, spread: 0, wheel: true },
  wheelRL: { dir: [-0.35, 0.35, 1], dist: 8, spread: 0, wheel: true },
  wheelRR: { dir: [-0.35, 0.35, -1], dist: 8, spread: 0, wheel: true },
  frontWing: { dir: [1, 0.15, 0], dist: 7, spread: 0.5 },
  rearWing: { dir: [-1, 0.45, 0], dist: 7, spread: 0.45 },
  cockpit: { dir: [0.3, 1, 0], dist: 5.2, spread: 0.5 },
  nose: { dir: [1, 0.7, 0], dist: 6.5, spread: 0.5 },
  body: { dir: [0, 1, 0], dist: 3, spread: 0.7 },
};
const blocks = [];
// Добавляет кубик; длинные кубики режутся на куски не длиннее maxLen шипов (как настоящие детали).
// opt.decal — имя наклейки на боковую грань (снаружи), opt.decalFace — 'side' (по умолчанию), 'back' или 'both'.
function add(part, color, x0, x1, y0, y1, z0, z1, opt) {
  opt = opt || {};
  const maxLen = opt.maxLen || 4;
  const whole = opt.dropFront || opt.dropBack || opt.sinkFront || opt.decal;
  const n = whole ? 1 : Math.max(1, Math.ceil((x1 - x0) / maxLen - 1e-6));
  for (let i = 0; i < n; i++) {
    const a = x0 + (x1 - x0) * i / n, b = x0 + (x1 - x0) * (i + 1) / n;
    blocks.push(Object.assign({}, opt, { part, color, x0: a, x1: b, y0, y1, z0, z1, studs: opt.studs !== false && !opt.decal }));
  }
}
// Кубик и его зеркальная копия по другую сторону машинки (z → -z).
function addSym(part, color, x0, x1, y0, y1, z0, z1, opt) {
  add(part, color, x0, x1, y0, y1, z0, z1, opt);
  add(part, color, x0, x1, y0, y1, -z1, -z0, opt);
}
// Особые детали (колёса, шлем, дуга halo) — готовая геометрия.
function addMesh(part, color, geo, x, y, z, rot, opt) {
  blocks.push(Object.assign({ part, color, geo, x, y, z, rot: rot || [0, 0, 0] }, opt || {}));
}

// Размеры сняты с бокового фото IMG_3999 по сетке «1 шип = 65 px». y — высота от земли.
// Днище и диффузор
add('body', C.black, -9.5, 6.5, 0.6, 1.0, -3, 3, { maxLen: 4, studs: false });
addSym('body', C.black, -7.5, 3.5, 0.6, 1.0, 3, 4.3, { studs: false, maxLen: 6 });
add('body', C.black, -13.2, -9.5, 0.6, 1.7, -3.2, 3.2, { studs: false, dropBack: 0.5 });
// Сердцевина под кабиной (почти не видна)
add('body', C.black, -4, 6.3, 1.0, 2.9, -2.2, 2.2, { studs: false, maxLen: 6 });
// Сайдподы (боковые понтоны) с наклейками
addSym('body', C.black, -7, 3.2, 1.1, 2.6, 2.2, 4.3, { decal: 'sp_low' });        // OAKLEY, EPOS, жёлтая линия
addSym('body', C.black, 3.2, 5.8, 1.3, 2.5, 2.4, 4.2, { decal: 'cogn' });         // cognizant
addSym('body', C.black, 3.2, 5.8, 2.5, 3.0, 2.4, 4.0, { studs: false });          // воздухозаборник сверху
addSym('body', C.dgreen, -4.2, 1.6, 2.6, 3.75, 2.2, 4.2, { decal: 'sp_top' });   // BOSS aramco citi
addSym('body', C.black, 1.6, 3.2, 2.6, 3.4, 2.2, 4.1, { studs: false });
addSym('body', C.black, -9, -4.2, 2.6, 3.6, 1.6, 3.8, { dropBack: 0.7 });          // сайдпод сужается назад
addSym('body', C.green, -9, -4.2, 3.6, 3.95, 1.6, 3.2, { dropBack: 0.6, studs: false });
// Борт под кабиной (крылья Aston Martin, жёлтая линия)
addSym('body', C.green, 1.5, 6.3, 2.9, 4.6, 1.2, 2.3, { decal: 'chassis' });
// Капот двигателя
add('body', C.green, -3, 1.5, 3.4, 4.6, -1.8, 1.8);
add('body', C.green, -8, -3, 3.4, 4.6, -1.8, 1.8, { dropBack: 0.9 });
add('body', C.green, -3, 0.3, 4.6, 5.9, -1.2, 1.2, { studs: false });
add('body', C.green, -3, 0.3, 5.9, 7.2, -1.2, 1.2, { studs: false });
add('body', C.green, -8.4, -3.0, 4.6, 7.4, -0.6, 0.6, { dropBack: 2.0, decal: 'fin', decalFace: 'both' }); // «плавник» ASTON MARTIN
add('body', C.black, -1.6, 0.6, 7.2, 7.8, -0.9, 0.9, { studs: false });           // воздухозаборник над пилотом
add('body', C.black, 0.3, 0.6, 6.3, 7.2, -0.6, 0.6, { studs: false });
// Коробка передач и задний фонарь
add('body', C.black, -13.4, -8, 1.8, 3.4, -1.2, 1.2, { studs: false, maxLen: 6 });
add('body', C.gray, -13.8, -13.4, 2.0, 2.6, -0.4, 0.4, { studs: false });
// Подвеска (тонкие рычаги)
addSym('body', C.black, 8.2, 9.0, 2.9, 3.15, 1.0, 4.45, { studs: false });
addSym('body', C.black, 8.0, 8.8, 1.7, 1.95, 1.0, 4.45, { studs: false });
addSym('body', C.black, -11.4, -10.6, 2.9, 3.15, 1.2, 4.35, { studs: false });
addSym('body', C.black, -11.3, -10.7, 1.6, 1.85, 1.2, 4.35, { studs: false });

// Кабина с пилотом
addSym('cockpit', C.green, 0.3, 4.4, 4.6, 5.25, 1.0, 2.0, { studs: false });
add('cockpit', C.green, 4.2, 6.3, 4.0, 4.9, -1.3, 1.3, { studs: false });
addMesh('cockpit', C.green, new THREE.CylinderGeometry(1.05, 1.05, 0.4, 32), 5.25, 5.1, 0);   // круглая плитка перед кабиной
add('cockpit', C.black, -0.2, 1.8, 4.6, 5.0, -0.9, 0.9, { studs: false });                    // сиденье
add('cockpit', C.green, 0.2, 1.5, 5.0, 6.3, -0.85, 0.85, { studs: false });                   // туловище пилота
addMesh('cockpit', C.green, new THREE.CylinderGeometry(0.3, 0.3, 0.3, 16), 0.85, 6.4, 0);     // шея
addMesh('cockpit', C.helmet, new THREE.SphereGeometry(0.95, 32, 24), 0.85, 6.95, 0, null, { roughness: 0.22 }); // шлем
addMesh('cockpit', 0x0b2416, new THREE.SphereGeometry(0.965, 32, 16, Math.PI - 0.75, 1.5, 1.15, 0.6), 0.85, 6.95, 0, null, { roughness: 0.08 }); // визор
addSym('cockpit', C.green, 1.3, 3.1, 5.7, 6.05, 0.55, 0.95, { studs: false });                // руки
add('cockpit', C.black, 3.0, 3.25, 5.4, 6.2, -0.65, 0.65, { studs: false });                  // руль
addMesh('cockpit', C.black, new THREE.TorusGeometry(1.45, 0.15, 10, 32, Math.PI).rotateX(Math.PI / 2).rotateY(Math.PI / 2), 2.2, 6.55, 0); // дуга halo
add('cockpit', C.black, 3.5, 3.8, 5.25, 6.55, -0.15, 0.15, { studs: false });                 // стойка halo
addSym('cockpit', C.black, 3.2, 4.0, 5.3, 5.7, 2.0, 2.9, { studs: false });                   // зеркала
addSym('cockpit', C.black, 3.4, 3.7, 4.9, 5.3, 1.9, 2.1, { studs: false });

// Нос: ровная задняя часть и наклонный перед
add('nose', C.green, 6.3, 9.0, 4.37, 5.08, -1.1, 1.1, { decal: 'nose_r' });
add('nose', C.green, 9.0, 13.2, 4.3, 5.0, -0.9, 0.9, { decal: 'nose_f', sinkFront: 0.85, dropFront: 0.25 });
add('nose', C.black, 6.3, 9.0, 3.9, 4.37, -0.9, 0.9, { studs: false });
add('nose', C.black, 9.0, 13.2, 3.9, 4.3, -0.75, 0.75, { studs: false, sinkFront: 0.85 });
add('nose', C.black, 13.2, 13.8, 3.05, 3.5, -0.7, 0.7, { studs: false });

// Переднее крыло
add('frontWing', C.black, 10.8, 14, 0.3, 0.7, -5.6, -1.8, { studs: false });
add('frontWing', C.black, 10.8, 14, 0.3, 0.7, -1.8, 1.8, { studs: false });
add('frontWing', C.black, 10.8, 14, 0.3, 0.7, 1.8, 5.6, { studs: false });
addSym('frontWing', C.black, 10.8, 12.6, 0.7, 1.1, 1.2, 5.6, { studs: false });
addSym('frontWing', C.black, 10.8, 11.8, 1.1, 1.5, 2.2, 5.6, { studs: false });
addSym('frontWing', C.dgreen, 10.8, 11.4, 1.5, 1.8, 3.2, 5.6, { studs: false });
addSym('frontWing', C.black, 11.6, 14.0, 0.3, 2.3, 5.6, 6.0, { decal: 'fw_end' });          // торцевые пластины, aramco cognizant
addSym('frontWing', C.black, 11.6, 12.4, 0.7, 3.2, 0.3, 0.7, { studs: false });              // стойки к носу

// Заднее крыло
addSym('rearWing', C.black, -14.1, -11.4, 2.6, 4.2, 3.6, 4.05, { studs: false });
addSym('rearWing', C.black, -14.1, -11.6, 4.2, 7.4, 3.6, 4.05, { decal: 'rw_end' });         // BANCO MASTER
addSym('rearWing', C.black, -11.6, -8.8, 5.6, 7.4, 3.6, 4.05, { studs: false, dropFront: 1.0 });
add('rearWing', C.black, -13.9, -11.2, 5.6, 6.3, -3.6, 3.6, { decal: 'rw_valv', decalFace: 'back' });   // Valvoline
add('rearWing', C.green, -13.6, -12.2, 6.3, 7.1, -3.6, 3.6, { decal: 'rw_band', decalFace: 'back' });  // aramco
add('rearWing', C.black, -13.6, -12.0, 2.6, 3.0, -3.2, 3.2, { studs: false });
add('rearWing', C.black, -12.6, -11.6, 3.4, 5.6, -0.35, 0.35, { studs: false });
add('rearWing', C.black, -12.0, -11.4, 6.3, 7.3, -0.3, 0.3, { studs: false });

// Колёса: шина (протектор), диск, боковина с фото (P ZERO PIRELLI)
function wheel(part, x, z, r, w, decal) {
  const s = Math.sign(z);
  const tyre = new THREE.CylinderGeometry(r, r, w, 48); tyre.rotateX(Math.PI / 2);
  const rim = new THREE.CylinderGeometry(r * 0.6, r * 0.6, w + 0.02, 32); rim.rotateX(Math.PI / 2);
  const side = new THREE.CircleGeometry(r, 64);
  if (s < 0) side.rotateY(Math.PI);
  addMesh(part, C.tyre, tyre, x, r, z, null, { roughness: 0.85, layer: 0 });
  addMesh(part, C.black, rim, x, r, z, null, { layer: 1 });
  addMesh(part, 0xffffff, side, x, r, z + s * (w / 2 + 0.012), null, { layer: 2, decalMesh: decal });
  PARTS[part].axle = [x, r, z];
  PARTS[part].radius = r;
}
const WHEEL_R = 1.85;
wheel('wheelFL', 8.6, 5.25, WHEEL_R, 1.7, 'wheel_f');
wheel('wheelFR', 8.6, -5.25, WHEEL_R, 1.7, 'wheel_f');
wheel('wheelRL', -11.05, 5.4, WHEEL_R, 2.2, 'wheel_r');
wheel('wheelRR', -11.05, -5.4, WHEEL_R, 2.2, 'wheel_r');

// ---------- сборка 3D-объектов ----------
const car = new THREE.Group();
car.name = 'car';
scene.add(car);
const pickables = [];
for (const name in PARTS) {

    ev.preventDefault();
    if (!canControl()) return;
    orbit.r = Math.min(120, Math.max(12, orbit.r * Math.exp(ev.deltaY * 0.001)));
    needRender = true;
  }, { passive: false });

  function frame(now) {
    if (playing) {
      t = Math.min(DURATION, t + (now - last) / 1000);
      if (t >= DURATION) playing = false;
      needRender = true;
    }
    last = now;
    if (t >= T.end && !endOrbitSet) { orbitFrom(HERO.pos, HERO.target); endOrbitSet = true; }
    if (needRender) {
      poseAt(t);
      renderer.render(scene, camera);
      scrub.value = t.toFixed(2);
      timeEl.textContent = t.toFixed(1) + ' с';
      needRender = false;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__lego = { blocks: BLOCK_COUNT, setTime, getTime: () => t, state, explodeStart, pause: () => { playing = false; },
    // для проверок: поставить камеру (позиция и точка, куда смотрит)
    view: (p, q) => { orbitFrom(new THREE.Vector3().fromArray(p), new THREE.Vector3().fromArray(q)); needRender = true; } };
}
</script>
